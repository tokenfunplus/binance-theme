<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reconstructed futures layout fixture</title>
    <style>
      body {
        margin: 0;
        font: 14px sans-serif;
        background: #fff;
      }
      .react-grid-layout {
        position: relative;
        width: 100%;
        height: 1130px;
      }
      .react-grid-item {
        box-sizing: border-box;
        background: var(--color-CardBg, #eee);
        border: 1px solid #777;
      }
      .RemovableCard {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .native-content {
        position: absolute;
        inset: 0;
        overflow: auto;
      }
      .orderform {
        padding: 10px;
      }
      input {
        width: 100px;
      }
    </style>
  </head>
  <body>
    <div class="react-grid-layout layout">
      <div
        class="react-grid-item react-draggable react-resizable"
        style="
          z-index: 1;
          top: 0;
          left: 83.3149%;
          width: 16.6851%;
          height: 630px;
          position: absolute;
        "
      >
        <div class="RemovableCard" style="grid-area: orderform">
          <div class="native-content orderform">
            <input id="futures-amount" value="0.1" /><button id="futures-buy">
              Buy
            </button>
          </div>
        </div>
        <span class="react-resizable-handle"></span>
      </div>
      <div
        class="react-grid-item react-draggable react-resizable"
        style="
          z-index: 2;
          top: 40px;
          left: 0;
          width: 66.6851%;
          height: 60px;
          position: absolute;
        "
      >
        <div style="grid-area: subheader">
          <div
            class="ticker-wrap"
            style="
              display: flex;
              align-items: center;
              gap: 24px;
              padding: 4px 16px;
            "
          >
            <strong>NEARUSDT 永续</strong>
            <div class="draggableHandle">
              <div
                id="ticker-price"
                class="text-6 font-medium text-Buy"
                style="
                  font-size: 24px;
                  line-height: 28px;
                  color: var(--color-Buy, #2ebd85);
                "
              >
                4.913
              </div>
              <div
                style="
                  display: flex;
                  gap: 4px;
                  font-size: 12px;
                  color: var(--color-Buy, #2ebd85);
                "
              >
                <div id="ticker-change">0.268</div>
                <div id="ticker-percent">+5.76%</div>
              </div>
            </div>
            <div>标记价格 <span id="ticker-mark">4.912</span></div>
          </div>
        </div>
      </div>
      <div
        class="react-grid-item react-draggable react-resizable"
        style="
          z-index: 1;
          top: 0;
          left: 0;
          width: 66.6851%;
          height: 40px;
          position: absolute;
        "
      >
        <div style="grid-area: favorite">Favorites</div>
      </div>
      <div
        class="react-grid-item react-draggable react-resizable"
        style="
          z-index: 1;
          top: 100px;
          left: 0;
          width: 66.6851%;
          height: 530px;
          position: absolute;
        "
      >
        <div class="RemovableCard" style="grid-area: chart">
          <div class="native-content">
            <div style="grid-area: chart">
              <div class="chart-widget-root">Chart canvas placeholder</div>
            </div>
          </div>
        </div>
      </div>
      <div
        class="react-grid-item react-draggable react-resizable"
        style="
          z-index: 1;
          top: 0;
          left: 66.6851%;
          width: 16.6851%;
          height: 430px;
          position: absolute;
        "
      >
        <div class="RemovableCard" style="grid-area: orderbook">
          <div class="native-content">
            <div style="grid-area: orderbook">
              <div id="futuresOrderbook">Orderbook</div>
            </div>
          </div>
        </div>
      </div>
      <div
        class="react-grid-item react-draggable react-resizable"
        style="
          z-index: 1;
          top: 430px;
          left: 66.6851%;
          width: 16.6851%;
          height: 200px;
          position: absolute;
        "
      >
        <div class="RemovableCard" style="grid-area: trades">
          <div class="native-content">
            <div class="tradew-tradelist">Recent trades</div>
          </div>
        </div>
      </div>
      <div
        class="react-grid-item react-draggable react-resizable"
        style="
          z-index: 1;
          top: 630px;
          left: 0;
          width: 83.3149%;
          height: 500px;
          position: absolute;
        "
      >
        <div class="RemovableCard" style="grid-area: userinfo">
          Positions and orders
        </div>
      </div>
      <div
        class="react-grid-item react-draggable react-resizable"
        style="
          z-index: 1;
          top: 630px;
          left: 83.3149%;
          width: 16.6851%;
          height: 500px;
          position: absolute;
        "
      >
        <div class="RemovableCard" style="grid-area: marginRatio">
          Margin ratio
        </div>
      </div>
    </div>
  </body>
</html>
